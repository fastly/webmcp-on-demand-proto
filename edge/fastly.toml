manifest_version = 3
name = "webmcp-on-demand"
description = "Automatically inject WebMCP declarative attributes into any website's HTML forms at the edge."
language = "javascript"
service_id = ""

[scripts]
  build = "npm exec -- js-compute-runtime src/index.js bin/main.wasm"

[local_server]
  [local_server.backends]
    [local_server.backends.origin]
      url = "http://127.0.0.1:3000"
